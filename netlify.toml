[build]
  command = "npm run build"
  publish = "dist/client"   # Nitro 的 netlify 预设通常输出到 dist/client
  # 如果构建后是 .output/public，就改成 .output/public，但建议先用 dist/client

[functions]
  directory = "dist/server" # 或 .output/server，根据实际调整

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
